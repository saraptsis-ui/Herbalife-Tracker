            <!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Herbalife Tracker">
<meta name="theme-color" content="#3a7d2c">
<title>Herbalife Team Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f2f8ef;font-family:'Nunito',sans-serif;color:#1a2e14;}
::-webkit-scrollbar{width:3px;}::-webkit-scrollbar-thumb{background:#b5d9a0;}
.card{background:#fff;border:1px solid #dcebd6;border-radius:14px;padding:16px;box-shadow:0 1px 8px rgba(0,0,0,.04);}
.btn{border:none;border-radius:10px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:800;transition:all .1s;font-size:15px;}
.gbtn{background:#3a7d2c;color:#fff;padding:14px;width:100%;font-size:16px;}
.gbtn:active{transform:scale(.98);}
.gbtn:disabled{opacity:.4;}
.ghost{background:#fff;border:2px solid #cce5c0;color:#3a7d2c;padding:9px 16px;font-size:13px;}
.ghost.on{background:#3a7d2c;border-color:#3a7d2c;color:#fff;}
.act-btn{background:#fff;border:2px solid #dcebd6;border-radius:12px;padding:14px;cursor:pointer;text-align:left;width:100%;font-family:'Nunito',sans-serif;transition:border-color .1s;}
.act-btn:active{transform:scale(.96);}
.act-btn.fl{border-color:#67bc2a;background:#f0fae8;}
.inp{background:#fff;border:2px solid #cce5c0;color:#1a2e14;border-radius:10px;padding:13px 16px;font-size:16px;font-family:'Nunito',sans-serif;width:100%;outline:none;}
.inp:focus{border-color:#3a7d2c;box-shadow:0 0 0 3px rgba(58,125,44,.15);}
.badge{background:#eaf6e4;color:#3a7d2c;border:1px solid #c0deb6;border-radius:6px;padding:3px 10px;font-size:13px;font-weight:800;display:inline-block;}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.tabs::-webkit-scrollbar{display:none;}
.pb-bg{background:#e8f5e0;border-radius:99px;height:10px;overflow:hidden;margin-top:6px;}
.pb-fill{height:10px;border-radius:99px;transition:width .5s;}
.row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #f0f6ee;}
.row:last-child{border-bottom:none;}
.hdr{background:#3a7d2c;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;}

@keyframes spin{to{transform:rotate(360deg)}}
.hdr-btn{background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:14px;font-family:'Nunito',sans-serif;font-weight:700;cursor:pointer;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100;}
@keyframes pf{0%{opacity:1;transform:translate(-50%,-65%) scale(.3);}40%{opacity:1;transform:translate(-50%,-55%) scale(1.2);}100%{opacity:0;transform:translate(-50%,-40%) scale(1);}}
.pop-anim{position:fixed;top:42%;left:50%;font-size:72px;font-weight:900;color:#3a7d2c;pointer-events:none;animation:pf .8s forwards;z-index:999;font-family:'Nunito',sans-serif;}
</style>
</head>

const DB = {
  // Φόρτωσε logs ενός συνεργάτη
  async getLogs(name) {
    const {data} = await sb.from('activity_logs')
      .select('*')
      .eq('member_name', name)
      .order('log_date', {ascending: true});
    if (!data) return {};
    const logs = {};
    data.forEach(row => {
      if (!logs[row.log_date]) logs[row.log_date] = [];
      logs[row.log_date].push({id: row.act_id, pts: row.pts, ts: new Date(row.created_at).getTime(), note: row.note || ''});
    });
    return logs;
  },

  // Αποθήκευσε log entry
  async addLog(name, actId, pts, note) {
    const today = todayKey();
    await sb.from('activity_logs').insert({
      member_name: name,
      act_id: actId,
      pts: pts,
      log_date: today,
      note: note || ''
    });
  },

  // Φόρτωσε στόχο
  async getGoal(name, monthPrefix) {
    const {data} = await sb.from('goals')
      .select('goal_pts')
      .eq('member_name', name)
      .eq('month_prefix', monthPrefix)
      .single();
    return data ? data.goal_pts : null;
  },

  // Αποθήκευσε στόχο
  async setGoal(name, monthPrefix, pts) {
    await sb.from('goals').upsert({
      member_name: name,
      month_prefix: monthPrefix,
      goal_pts: pts
    }, {onConflict: 'member_name,month_prefix'});
  },

  // Φόρτωσε PIN
  async getPin(name) {
    const {data} = await sb.from('members')
      .select('pin')
      .eq('name', name)
      .single();
    return data ? data.pin : null;
  },

  // Αποθήκευσε PIN (upsert)
  async setPin(name, pin) {
    await sb.from('members').upsert({name, pin}, {onConflict: 'name'});
  },

  // Λίστα συνεργατών
  async getMembers() {
    const {data} = await sb.from('members').select('name').order('name');
    return data ? data.map(r => r.name) : [];
  },

  // Διαγραφή συνεργάτη
  async deleteMember(name) {
    await sb.from('activity_logs').delete().eq('member_name', name);
    await sb.from('goals').delete().eq('member_name', name);
    await sb.from('members').delete().eq('name', name);
  },

  // Φόρτωσε όλα για manager
  async getAllData() {
    const members = await this.getMembers();
    const mk = mPrefix(), pmk = mPrefix(-1);
    const allLogs = {}, allGoals = {}, allPrevGoals = {};
    await Promise.all(members.map(async m => {
      allLogs[m] = await this.getLogs(m);
      allGoals[m] = await this.getGoal(m, mk);
      allPrevGoals[m] = await this.getGoal(m, pmk);
    }));
    return {members, allLogs, allGoals, allPrevGoals};
  }
};

// Helpers
function todayKey(){return new Date().toISOString().slice(0,10);}
function mPrefix(off=0){const d=new Date();d.setMonth(d.getMonth()+off);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function mName(off=0){const d=new Date();d.setMonth(d.getMonth()+off);return d.toLocaleDateString("el-GR",{month:"long",year:"numeric"});}
function fmtFull(s){return new Date(s).toLocaleDateString("el-GR",{weekday:"long",day:"numeric",month:"long"});}
function fmtDay(s){return new Date(s).toLocaleDateString("el-GR",{weekday:"short",day:"numeric"});}
function fmtTime(ts){return new Date(ts).toLocaleTimeString("el-GR",{hour:"2-digit",minute:"2-digit"});}
function sumAll(logs){return Object.values(logs||{}).flat().reduce((s,e)=>s+e.pts,0);}
function todaySum(logs){return((logs||{})[todayKey()]||[]).reduce((s,e)=>s+e.pts,0);}
function mSum(logs,off=0){const p=mPrefix(off);return Object.entries(logs||{}).filter(([k])=>k.startsWith(p)).flatMap(([,v])=>v).reduce((s,e)=>s+e.pts,0);}
function daysInactive(logs){const ks=Object.keys(logs||{}).sort().reverse();if(!ks.length)return 999;return Math.floor((new Date(todayKey())-new Date(ks[0]))/86400000);}
function getWeeks(){
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),dim=new Date(y,m+1,0).getDate(),fd=new Date(y,m,1).getDay(),ws=[];
  for(let w=1;w<=5;w++){const days=[];for(let d=1;d<=dim;d++){if(Math.ceil((d+fd)/7)===w)days.push(y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"));}if(days.length)ws.push({w,days});}
  return ws;
}
function wkPts(logs,days){return days.reduce((s,d)=>s+(logs[d]||[]).reduce((ss,e)=>ss+e.pts,0),0);}
function curWkIdx(){const t=todayKey();return getWeeks().findIndex(w=>w.days.includes(t));}

function BarChart({data,height=120}){
  const max=Math.max(...data.map(d=>d.v),1);
  const bw=28,gap=8,pad=4;
  const w=data.length*(bw+gap)-gap+pad*2;
  return `<svg width="100%" viewBox="0 0 ${w} ${height+24}" style="overflow:visible">
    ${data.map((d,i)=>{
      const bh=Math.max(2,(d.v/max)*(height-10));
      const x=pad+i*(bw+gap);
      const y=height-bh;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" fill="${G}" opacity="${d.today?1:.7}"/>
        <text x="${x+bw/2}" y="${height+14}" text-anchor="middle" font-size="9" fill="#aac89a" font-family="Nunito">${d.label}</text>
        ${d.v>0?`<text x="${x+bw/2}" y="${y-3}" text-anchor="middle" font-size="9" fill="${G}" font-weight="800" font-family="Nunito">${d.v}</text>`:""}`;
    }).join("")}
  </svg>`;
}

async function doLoginMember(){
  const name=state.nameInput.trim();
  if(!name) return;
  showLoading("Σύνδεση...");

  const pin = await DB.getPin(name);

  if(!pin){
    // Νέος συνεργάτης
    setState({user:name, pinSetup:true, loginErr:""});
    return;
  }
  if(state.pinInput !== pin){
    setState({loginErr:"Λάθος κωδικός!"});
    return;
  }

  showLoading("Φόρτωση δεδομένων...");
  const mk = mPrefix();
  const logs = await DB.getLogs(name);
  const goal = await DB.getGoal(name, mk);
  setState({logs, goal, user:name, screen:"member", tab:"log", loginErr:""});
}

async function doSavePin(){
  if(state.newPin.length < 4){setState({loginErr:"Τουλάχιστον 4 ψηφία"});return;}
  showLoading("Αποθήκευση...");
  await DB.setPin(state.user, state.newPin);
  const mk = mPrefix();
  const logs = await DB.getLogs(state.user);
  const goal = await DB.getGoal(state.user, mk);
  setState({pinSetup:false, newPin:"", logs, goal, screen:"member", tab:"log", loginErr:""});
}

async function doLogAct(act, note){

  const today = todayKey();
  const entry = {id:act.id, pts:act.pts, ts:Date.now(), note:note||""};
  const logs = {...state.logs, [today]:[...(state.logs[today]||[]), entry]};
  setState({logs, noteAct:null, note:"", flash:act.id, popAnim:`+${act.pts}`});
  setTimeout(()=>setState({flash:null, popAnim:null}), 800);

  // Telegram notification
  const act_info = ACTS.find(a=>a.id===act.id);
  sendTelegram(`${act_info.icon} <b>${state.user}</b> — ${act_info.label}\n+${act.pts} πόντοι${note?`\n💬 ${note}`:""}`);
}

// Render helpers
function h(tag,attrs,inner){
  const a=Object.entries(attrs||{}).map(([k,v])=>{
    if(k==="style"&&typeof v==="object")return `style="${Object.entries(v).map(([sk,sv])=>sk.replace(/([A-Z])/g,c=>"-"+c.toLowerCase())+":"+sv).join(";")}"`;
    if(k==="class")return `class="${v}"`;
    if(k.startsWith("on"))return ``;
    return `${k}="${v}"`;
  }).join(" ");
  const selfClose=["input","img","br","hr"].includes(tag);
  if(selfClose)return `<${tag} ${a}>`;
  return `<${tag} ${a}>${Array.isArray(inner)?inner.join(""):inner||""}</${tag}>`;
}

function Logo(ht=36){return `<img src="${LOGO_SRC}" alt="Herbalife" style="height:${ht}px;object-fit:contain">`;}

function ProgressBar(pct,color,height=10){
  const c=color||( pct>=75?G:pct>=50?"#e6a817":"#e05252");
  return `<div class="pb-bg" style="height:${height}px"><div class="pb-fill" style="width:${Math.min(100,pct)}%;height:${height}px;background:${c}"></div></div>`;
}

function GoalSection(logs,goal){
  const weeks=getWeeks(),cwi=curWkIdx();
  const mp=mSum(logs),wg=goal?Math.round(goal/weeks.length):0;
  const pct=goal?Math.min(100,Math.round((mp/goal)*100)):0;
  const status=!goal?"":`<div style="font-size:13px;margin-top:8px;font-weight:700;color:#555">${pct>=100?"✅ Στόχος επιτεύχθηκε!":pct>=75?"🔥 Πολύ κοντά!":pct>=50?"💪 Στα μισά, συνέχισε!":pct>=25?"⚠️ Χρειάζεσαι επιτάχυνση":"🚨 Πίσω από τον στόχο"}</div>`;
  const weekRows=weeks.map(({w,days},idx)=>{
    const wpts=wkPts(logs,days),wpct=wg?Math.min(100,Math.round((wpts/wg)*100)):0;
    const isCur=idx===cwi,isPast=idx<cwi,isOk=wpts>=wg;
    return `<div style="margin-bottom:8px;opacity:${idx>cwi?0.4:1}">
      <div style="display:flex;justify-content:space-between;font-size:13px">
        <span style="font-weight:${isCur?900:600};color:${isCur?G:"#6a9a5a"}">${isCur?"▶ ":""}Εβδομάδα ${w}</span>
        <span style="font-weight:700;color:${isPast&&!isOk?"#e05252":G}">${wpts}/${wg} ${isPast?(isOk?"✅":"❌"):""}</span>
      </div>
      ${ProgressBar(wpct,isPast&&!isOk?"#e05252":G,7)}
    </div>`;
  }).join("");

  if(!goal)return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div style="font-weight:800;font-size:14px;color:${G}">🎯 Μηνιαίος Στόχος — ${mName()}</div>
      <button class="btn ghost" style="font-size:12px;padding:4px 10px" onclick="setState({goalEditing:true,goalInput:''})">Ορισμός</button>
    </div>
    <div style="font-size:13px;color:#aac89a">Ορίσε μηνιαίο στόχο για να παρακολουθείς την πρόοδό σου.</div>
  </div>`;

  return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div style="font-weight:800;font-size:14px;color:${G}">🎯 Μηνιαίος Στόχος — ${mName()}</div>
      <button class="btn ghost" style="font-size:12px;padding:4px 10px" onclick="setState({goalEditing:true,goalInput:'${goal}'})">Αλλαγή</button>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:#6a9a5a;margin-bottom:4px">
      <span>${mp} / ${goal} πόντοι</span>
      <span style="font-weight:800;color:${pct>=75?G:pct>=50?"#e6a817":"#e05252"}">${pct}%</span>
    </div>
    ${ProgressBar(pct)}
    ${status}
    <div style="margin-top:14px">
      <div style="font-size:11px;color:#8ab870;font-weight:800;letter-spacing:.1em;margin-bottom:8px">ΕΒΔΟΜΑΔΙΑΙΑ ΑΝΑΛΥΣΗ</div>
      ${weekRows}
    </div>
  </div>`;
}

          ${ProgressBar(mpct)}
          <div style="margin-top:12px">${wkRows}</div>
        </div>`:`<div class="card" style="font-size:13px;color:#aac89a">Δεν έχει οριστεί στόχος.</div>`}
        <div class="card">
          <div style="font-size:11px;color:#8ab870;font-weight:800;letter-spacing:.1em;margin-bottom:12px">ΣΥΝΟΛΟ ΑΝΑ ΔΡΑΣΤΗΡΙΟΤΗΤΑ</div>
          ${actSum||"<div style='font-size:13px;color:#aac89a'>Καμία δραστηριότητα ακόμα.</div>"}
        </div>
        ${dayLogs}
      </div>
    </div>`;
    document.getElementById("app").innerHTML=html;
    return;
  }

  // MEMBER SCREEN
  if(s.screen==="member"){
    const tc={};(s.logs[todayKey()]||[]).forEach(e=>{tc[e.id]=(tc[e.id]||0)+1;});
    const last7=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d.toISOString().slice(0,10);});
    const chartData=last7.map(d=>({label:fmtDay(d),v:(s.logs[d]||[]).reduce((ss,e)=>ss+e.pts,0),today:d===todayKey()}));

    const actGrid=ACTS.map(a=>`<button class="act-btn ${s.flash===a.id?"fl":""}" onclick="setState({noteAct:ACTS.find(x=>x.id==='${a.id}'),note:''})">
      <div style="font-size:26px;margin-bottom:6px">${a.icon}</div>
      <div style="font-size:13px;color:#6a8a5a;line-height:1.3;margin-bottom:8px">${a.label}</div>
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="badge">+${a.pts}</span>
        ${tc[a.id]>0?`<span style="font-size:12px;color:#aac89a">×${tc[a.id]}</span>`:""}
      </div>
    </button>`).join("");

    const monthComp=`<div class="card">
      <div style="font-weight:800;font-size:14px;color:${G};margin-bottom:12px">📈 Σύγκριση Μηνών</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div style="background:#f5f5f5;border-radius:10px;padding:12px">
          <div style="font-size:11px;color:#999;font-weight:700">${mName(-1).toUpperCase()}</div>
          <div style="font-size:28px;font-weight:900;color:#aaa">${mSum(s.logs,-1)}</div>
        </div>
        <div style="background:#eaf6e4;border-radius:10px;padding:12px;border:2px solid ${G}">
          <div style="font-size:11px;color:${G};font-weight:700">${mName().toUpperCase()}</div>
          <div style="font-size:28px;font-weight:900;color:${G}">${mSum(s.logs)}</div>
        </div>
      </div>
    </div>`;

    const histItems=Object.keys(s.logs).sort((a,b)=>b.localeCompare(a)).map(day=>{
      const entries=s.logs[day]||[],pts=entries.reduce((s,e)=>s+e.pts,0);
      const rows=entries.sort((a,b)=>a.ts-b.ts).map(en=>{
        const act=ACTS.find(a=>a.id===en.id);if(!act)return"";
        return `<div class="row"><span style="font-size:20px">${act.icon}</span><div style="flex:1"><div style="font-size:14px">${act.label}</div>${en.note?`<div style="font-size:12px;color:#8ab870;margin-top:2px">💬 ${en.note}</div>`:""}</div><span style="font-size:12px;color:#aac89a">${fmtTime(en.ts)}</span><span style="font-weight:800;color:${GL};font-size:14px">+${en.pts}</span></div>`;
      }).join("");
      return `<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><div style="font-weight:800;font-size:14px;color:${G}">${fmtFull(day)}</div><span class="badge">${pts} pts</span></div>${rows}</div>`;
    }).join("<div style='height:10px'></div>");

    const installBanner=s.showInstall?`<div style="background:#fff;border:2px solid #c0deb6;border-radius:14px;padding:14px 16px;margin:0 20px 14px;display:flex;align-items:flex-start;gap:12px">
      <div style="font-size:24px">📱</div>
      <div>
        <div style="font-weight:800;font-size:14px;color:${G};margin-bottom:4px">Εγκατάσταση στην αρχική οθόνη</div>
        <div style="font-size:13px;color:#6a9a5a;line-height:1.5">Πάτα <strong>Share (□↑)</strong> → <strong>"Add to Home Screen"</strong></div>
      </div>
      <button onclick="setState({showInstall:false})" style="background:none;border:none;color:#aac89a;font-size:18px;cursor:pointer;margin-left:auto;padding:0">✕</button>
    </div>`:"";

    html=`${pop}
    <div style="min-height:100vh;background:${BG};padding-bottom:80px">
      <div class="hdr">
        ${Logo(32)}
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          <span style="font-size:12px;color:rgba(255,255,255,.8)">Γεια, <strong style="color:#fff">${s.user}</strong></span>
          <button class="hdr-btn" style="font-size:11px;padding:4px 10px" onclick="doLogout()">Έξοδος</button>
        </div>
      </div>
      ${installBanner}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px 14px">
        <div class="card" style="border-top:4px solid ${G}">
          <div style="font-size:11px;color:#8ab870;font-weight:800;margin-bottom:4px">ΣΗΜΕΡΑ</div>
          <div style="font-size:44px;font-weight:900;color:${G};line-height:1">${todaySum(s.logs)}</div>
          <div style="font-size:11px;color:#aac89a;margin-top:2px">πόντοι</div>
        </div>
        <div class="card" style="border-top:4px solid #cce5c0">
          <div style="font-size:11px;color:#8ab870;font-weight:800;margin-bottom:4px">ΜΗΝΑΣ</div>
          <div style="font-size:44px;font-weight:900;color:${TX};line-height:1">${mSum(s.logs)}</div>
          <div style="font-size:11px;color:#aac89a;margin-top:2px">πόντοι</div>
        </div>
      </div>
      <div style="padding:0 20px 14px">
        <div class="tabs">
          ${[["log","ΚΑΤΑΓΡΑΦΗ"],["goal","ΣΤΟΧΟΣ"],["charts","ΓΡΑΦΗΜΑΤΑ"],["history","ΙΣΤΟΡΙΚΟ"]].map(([id,lbl])=>`<button class="btn ghost ${s.tab===id?"on":""}" onclick="setState({tab:'${id}'})">${lbl}</button>`).join("")}
        </div>
      </div>
      ${s.tab==="log"?`<div style="padding:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:10px">${actGrid}</div>`:""}
      ${s.tab==="goal"?`<div style="padding:0 20px">${GoalSection(s.logs,s.goal)}</div>`:""}
      ${s.tab==="charts"?`<div style="padding:0 20px;display:flex;flex-direction:column;gap:14px">
        <div class="card">
          <div style="font-size:11px;color:#8ab870;font-weight:800;margin-bottom:14px">ΤΕΛΕΥΤΑΙΕΣ 7 ΜΕΡΕΣ</div>
          ${BarChart({data:chartData})}
        </div>
        ${monthComp}
      </div>`:""}
      ${s.tab==="history"?`<div style="padding:0 20px;display:flex;flex-direction:column;gap:10px">${histItems||"<div style='text-align:center;color:#aac89a;padding-top:60px;font-size:14px'>Δεν υπάρχει ιστορικό.</div>"}</div>`:""}
    </div>`;
    document.getElementById("app").innerHTML=html;
    return;
  }

  // MANAGER SCREEN
  if(s.screen==="manager"){
    const board=s.members.map((m,i)=>{
      const mg=s.allGoals[m],mp=mSum(s.allLogs[m]),pp=mSum(s.allLogs[m],-1),pct=mg?Math.min(100,Math.round((mp/mg)*100)):null;
      return{name:m,total:sumAll(s.allLogs[m]),today:todaySum(s.allLogs[m]),mp,pp,goal:mg,pct,inactive:daysInactive(s.allLogs[m]),color:COLORS[i%COLORS.length]};
    }).sort((a,b)=>b.total-a.total);

    const lbRows=board.map((m,i)=>`<div class="card" style="border-left:5px solid ${m.color};cursor:pointer;margin-bottom:8px" onclick="setState({selMember:'${m.name}'})">
      <div style="display:flex;align-items:center;gap:14px">
        <div style="font-size:24px;width:32px;text-align:center">${i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}</div>
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:6px">
            <div style="font-weight:800;font-size:15px">${m.name}</div>
            ${m.inactive>=3?`<span style="font-size:12px;color:#e05252;font-weight:700">⚠️ ${m.inactive}μ</span>`:""}
          </div>
          <div style="font-size:12px;color:#8ab870;margin-top:2px">Σήμερα: <strong style="color:${G}">${m.today} pts</strong>${m.goal?` | Μήνας: ${m.mp}/${m.goal}`:""}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:26px;font-weight:900;color:${m.color};line-height:1">${m.total}</div>
          <div style="font-size:11px;color:#aac89a">ΣΥΝΟΛΟ</div>
        </div>
        <div style="color:#cce5c0;font-size:18px">›</div>
      </div>
      ${m.goal?`<div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:11px;color:#aac89a;margin-bottom:3px"><span>Μηνιαίος στόχος</span><span style="font-weight:700;color:${m.pct>=75?G:m.pct>=50?"#e6a817":"#e05252"}">${m.pct}%</span></div>${ProgressBar(m.pct,null,6)}</div>`:""}
    <div style="text-align:right;margin-top:8px"><button class="btn" style="background:#ffe5e5;color:#e05252;border:1px solid #ffb3b3;padding:4px 12px;font-size:11px;border-radius:8px" onclick="event.stopPropagation();deleteMember('${m.name}')">🗑 Διαγραφή</button></div>
    </div>`).join("");

    const sumRows=board.map(m=>`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f6ee">
      <div style="font-size:20px">${m.goal&&m.mp>=m.goal?"✅":m.inactive>=3?"🚨":"⏳"}</div>
      <div style="flex:1"><div style="font-weight:700;font-size:14px">${m.name}</div><div style="font-size:12px;color:#8ab870">${m.mp} πόντοι${m.goal?` / ${m.goal} (${m.pct}%)`:" (χωρίς στόχο)"}</div></div>
      ${m.inactive>=3?`<span style="font-size:12px;color:#e05252;font-weight:700">⚠️ ${m.inactive}μ</span>`:""}
    </div>`).join("");

    const cmpRows=board.map(m=>{const diff=m.mp-m.pp;return`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f6ee">
      <div style="font-size:20px">${diff>0?"📈":diff<0?"📉":"➡️"}</div>
      <div style="flex:1"><div style="font-weight:700;font-size:14px">${m.name}</div><div style="font-size:12px;color:#8ab870">${m.pp} → ${m.mp}</div></div>
      <span style="font-weight:800;font-size:14px;color:${diff>0?G:diff<0?"#e05252":"#aaa"}">${diff>0?"+":""}${diff}</span>
    </div>`;}).join("");

    const last7=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d.toISOString().slice(0,10);});
    const teamChartData=last7.map(d=>({label:fmtDay(d),v:s.members.reduce((ss,m)=>ss+(s.allLogs[m]?.[d]||[]).reduce((sss,e)=>sss+e.pts,0),0),today:d===todayKey()}));

    html=`${pop}
    <div style="min-height:100vh;background:${BG};padding-bottom:80px">
      <div class="hdr">
        <div>${Logo(28)}<div style="font-size:11px;color:rgba(255,255,255,.7);margin-top:4px">Coach · ${s.members.length} συνεργάτες</div></div>
        <div style="display:flex;gap:8px">
          <button class="hdr-btn" style="font-size:18px" onclick="doRefresh()">↻</button>
          <button class="hdr-btn" style="background:#f5c842;color:#1a2e14;font-size:12px;font-weight:800" onclick="doSendReport()">📊 Αναφορά</button>
          <button class="hdr-btn" style="font-size:12px" onclick="doLogout()">Έξοδος</button>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 20px">
        <div class="card" style="border-top:4px solid ${G}">
          <div style="font-size:11px;color:#8ab870;font-weight:800;margin-bottom:4px">ΟΜΑΔΑ ΣΗΜΕΡΑ</div>
          <div style="font-size:40px;font-weight:900;color:${G};line-height:1">${s.members.reduce((ss,m)=>ss+todaySum(s.allLogs[m]||{}),0)}</div>
        </div>
        <div class="card" style="border-top:4px solid #cce5c0">
          <div style="font-size:11px;color:#8ab870;font-weight:800;margin-bottom:4px">ΟΜΑΔΑ ΜΗΝΑΣ</div>
          <div style="font-size:40px;font-weight:900;color:${TX};line-height:1">${s.members.reduce((ss,m)=>ss+mSum(s.allLogs[m]||{}),0)}</div>
        </div>
      </div>
      <div style="padding:0 20px 14px">
        <div class="tabs">
          ${[["leaderboard","ΚΑΤΑΤΑΞΗ"],["summary","ΣΥΝΟΨΗ"],["team_chart","ΓΡΑΦΗΜΑ"],["members","ΑΝΑΛΥΣΗ"]].map(([id,lbl])=>`<button class="btn ghost ${s.tab===id?"on":""}" onclick="setState({tab:'${id}'})">${lbl}</button>`).join("")}
        </div>
      </div>
      ${s.tab==="leaderboard"?`<div style="padding:0 20px">${lbRows||"<div style='text-align:center;color:#aac89a;padding-top:60px'>Κανένας ακόμα. Πάτα ↻</div>"}<div style="text-align:center;font-size:12px;color:#aac89a;padding-top:4px">Πάτα σε συνεργάτη για αναλυτικό ιστορικό</div></div>`:""}
      ${s.tab==="summary"?`<div style="padding:0 20px;display:flex;flex-direction:column;gap:12px">
        <div class="card"><div style="font-weight:800;font-size:14px;color:${G};margin-bottom:12px">📊 Μηνιαία Σύνοψη — ${mName()}</div>${sumRows}</div>
        <div class="card"><div style="font-weight:800;font-size:14px;color:${G};margin-bottom:12px">📈 Σύγκριση με ${mName(-1)}</div>${cmpRows}</div>
      </div>`:""}
      ${s.tab==="team_chart"?`<div style="padding:0 20px"><div class="card"><div style="font-size:11px;color:#8ab870;font-weight:800;margin-bottom:14px">ΟΜΑΔΑ — 7 ΜΕΡΕΣ</div>${BarChart({data:teamChartData})}</div></div>`:""}
      ${s.tab==="members"?`<div style="padding:0 20px;display:flex;flex-direction:column;gap:10px">${board.map(m=>{
        const ac={};Object.values(s.allLogs[m.name]||{}).flat().forEach(e=>{ac[e.id]=(ac[e.id]||0)+1;});
        return`<div class="card" style="cursor:pointer;border-left:5px solid ${m.color}" onclick="setState({selMember:'${m.name}'})">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px">
            <div style="display:flex;align-items:center;gap:6px"><div style="font-weight:800;font-size:15px">${m.name}</div>${m.inactive>=3?`<span style="font-size:12px;color:#e05252">⚠️</span>`:""}</div>
            <span class="badge">${m.total} pts</span>
          </div>
          ${m.goal?`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:12px;color:#aac89a;margin-bottom:2px"><span>Μήνας: ${m.mp}/${m.goal}</span><span style="color:${m.pct>=75?G:m.pct>=50?"#e6a817":"#e05252"};font-weight:700">${m.pct}%</span></div>${ProgressBar(m.pct,null,5)}</div>`:""}
          <div style="display:flex;flex-wrap:wrap;gap:6px">${ACTS.filter(a=>ac[a.id]>0).map(a=>`<span style="font-size:12px;background:#f0fae8;border:1px solid #cce5c0;border-radius:6px;padding:3px 8px;color:${G}">${a.icon} ×${ac[a.id]}</span>`).join("")||`<span style="font-size:13px;color:#aac89a">Καμία δραστηριότητα</span>`}</div>
          <div style="font-size:12px;color:#b0d0a0;margin-top:8px">Πάτα για αναλυτικό ιστορικό ›</div>
        </div>`;
      }).join("")}</div>`:""}
    </div>`;
    document.getElementById("app").innerHTML=html;
    return;
  }
}

render();
</script>
</body>
</html>
